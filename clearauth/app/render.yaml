# One-click deploy on Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: clearauth
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
