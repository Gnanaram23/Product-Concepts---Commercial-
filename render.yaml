# One-click deploy of the ClearAuth server on Render: New > Blueprint > this repository.
services:
  - type: web
    name: clearauth
    runtime: docker
    plan: free
    dockerfilePath: ./clearauth/app/Dockerfile
    dockerContext: ./clearauth/app
    healthCheckPath: /api/healthz
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
