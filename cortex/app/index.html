    <script>
      // Restores a deep link after a static host sent the visitor through 404.html (see the Pages workflow).
      (function () {
        var q = new URLSearchParams(window.location.search);
        var p = q.get("__path");
        if (!p) return;
        q.delete("__path");
        var rest = q.toString();
        history.replaceState(null, "", p + (rest ? "?" + rest : "") + window.location.hash);
      })();
    </script>
